# Site settings
# NOTE: this file is NOT reloaded automatically by `jekyll serve`.
# Restart the server after changing it.

locale                   : "en-US"
title                    : "Home page"
title_separator          : "-"
name                     : "Tirsi Prebibaj"
description              : "personal description"
url                      : https://tprebiba.github.io
baseurl                  : ""
repository               : "tprebiba/tprebiba.github.io"

# Sidebar author profile (see _includes/author-profile.html for all supported fields)
author:
  avatar           : "profile2b.png"
  name             : "Tirsi Prebibaj"
  bio              : "Accelerator physics, data analysis and physics outreach."
  location         : "Switzerland"
  employer         : "EPFL"
  email            : "tirsi.prebibaj@cern.ch"
  googlescholar    : "https://scholar.google.com/citations?hl=el&user=tWvIRw8AAAAJ"
  github           : "tprebiba"
  linkedin         : "tirsi-prebibaj-15207911b"

# Structured data for search engines (not visible on the page)
social:
  type: Person
  links:
    - "https://github.com/tprebiba"
    - "https://www.linkedin.com/in/tirsi-prebibaj-15207911b"
    - "https://scholar.google.com/citations?user=tWvIRw8AAAAJ"

# Headings used to group entries on the Publications page
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'
  conferences:
    title: 'Conference Papers'

# Behaviour
breadcrumbs              : false
future                   : true
read_more                : "disabled"
atom_feed:
  hide                   : false

# Reading files
include:
  - _pages
exclude:
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections (one folder per section of the site)
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  repositories:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Default front matter per content type
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
  - scope:
      path: ""
      type: repositories
    values:
      layout: single
      author_profile: true
      share: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Output
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# HTML compression
compress_html:
  clippings: all
  ignore:
    envs: development
